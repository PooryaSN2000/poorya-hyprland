# Hyprlock Ultra-Minimal Clean Glass Screen
general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    path = /home/pooryasn/.config/hypr/wallpapers/shaded_landscape.png
    blur_passes = 3
    blur_size = 6
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 260, 44
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.25
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Password</span>
    hide_input = false
    rounding = 22
    check_color = rgba(255, 255, 255, 0.4)
    fail_color = rgba(243, 139, 168, 0.6)
    fail_text = <i>$FAIL</i>
    position = 0, -50
    halign = center
    valign = center
    font_color = rgb(255, 255, 255)
    inner_color = rgba(255, 255, 255, 0.03)
    outer_color = rgba(255, 255, 255, 0.12)
    shadow_passes = 0
}

# Clock (Clean regular typography, pure soft white, zero shadow)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 80
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
    shadow_passes = 0
}

# Date (Minimal single-tone subtitle)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgba(255, 255, 255, 0.6)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 55
    halign = center
    valign = center
    shadow_passes = 0
}
