################################################################################
# HYPRLAND MINIMAL & BEAUTIFUL CONFIGURATION (Catppuccin Mocha Aesthetic)
################################################################################

### MONITORS ###
# Source visual display configuration (generated by nwg-displays or manual edits)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf

# Default fallback detection
monitor = , preferred, auto, 1

### DEFAULT PROGRAMS ###
$terminal = ptyxis
$fileManager = nautilus
$menu = wofi --show drun --allow-images
$powermenu = /home/pooryasn/.config/hypr/scripts/powermenu.sh

### AUTOSTART ###
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hyprpaper
exec-once = waybar
# Pinned apps are now integrated directly into the top bar quicklaunch capsule
# exec-once = waybar -c /home/pooryasn/.config/waybar/dock.jsonc -s /home/pooryasn/.config/waybar/dock.css
exec-once = python3 /home/pooryasn/.config/hypr/scripts/desktop_widget.py
exec-once = nm-applet --indicator
exec-once = swayosd-server
exec-once = hypridle
exec-once = /usr/libexec/hyprpolkitagent || /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1 || lxpolkit
exec-once = dunst
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = which udiskie >/dev/null && udiskie --tray --automount --notify


### ENVIRONMENT VARIABLES ###
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Wayland app integration
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Multi-GPU routing (Intel iGPU primary for laptop eDP, NVIDIA dGPU for HDMI)
# Auto-detected by Aquamarine DRM backend

# NVIDIA Graphics compatibility (RTX 4050 Laptop)
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

cursor {
    no_hardware_cursors = true
    enable_hyprcursor = true
    sync_gsettings_theme = true
}

### INPUT CONFIGURATION ###
input {
    kb_layout = us,ir
    kb_variant = ,winkeys
    kb_options = grp:ctrl_space_toggle
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# Touchpad Gestures
gesture = 3, horizontal, workspace

### LOOK AND FEEL ###
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # Animated Catppuccin Mocha gradient: Mauve -> Sapphire -> Teal -> Flamingo
    col.active_border = rgba(cba6f7ee) rgba(89b4faee) rgba(94e2d5ee) rgba(f5c2e7ee) 45deg
    col.inactive_border = rgba(313244aa)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 12

    active_opacity = 0.98
    inactive_opacity = 0.90

    dim_inactive = true
    dim_strength = 0.08

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(11111b88)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
    }
}

### FLUID ANIMATIONS ###
animations {
    enabled = yes

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = liner, 1, 1, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1

    animation = global, 1, 6, default
    animation = border, 1, 4, easeOutQuint
    animation = borderangle, 1, 25, liner, loop
    animation = windows, 1, 4.5, easeOutQuint
    animation = windowsIn, 1, 4, easeOutQuint, popin 85%
    animation = windowsOut, 1, 2.5, linear, popin 85%
    animation = fadeIn, 1, 2.5, almostLinear
    animation = fadeOut, 1, 2.5, almostLinear
    animation = fade, 1, 3, quick
    animation = workspaces, 1, 3.5, easeOutQuint, slide
}

### LAYOUT RULES ###
dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    allow_session_lock_restore = true
    disable_hyprland_guiutils_check = true
}

### KEYBINDINGS ###
$mainMod = SUPER

# Applications & Launchers
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, Space, exec, $menu
bind = $mainMod, R, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, I, exec, env XDG_CURRENT_DESKTOP=GNOME gnome-control-center
bind = $mainMod, V, exec, /home/pooryasn/.config/hypr/scripts/clipmanager.sh
bind = $mainMod SHIFT, V, togglefloating,
bind = $mainMod, G, togglefloating,
bind = $mainMod SHIFT, C, exec, /home/pooryasn/.config/hypr/scripts/colorpicker.sh
bind = $mainMod SHIFT, N, exec, /home/pooryasn/.config/hypr/scripts/nightlight.sh
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, M, exec, $powermenu
bind = $mainMod, Backspace, exec, $powermenu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, W, exec, /home/pooryasn/.config/hypr/scripts/wallselect.sh
bind = $mainMod, D, exec, /home/pooryasn/.config/hypr/scripts/docktoggle.sh
bind = $mainMod, B, exec, /home/pooryasn/.config/hypr/scripts/widgettoggle.sh
bind = $mainMod, A, exec, /home/pooryasn/.config/hypr/scripts/audioswitcher.py
bind = $mainMod, C, exec, /home/pooryasn/.config/hypr/scripts/calculator.sh
bind = $mainMod, T, exec, /home/pooryasn/.config/hypr/scripts/scratchpad_toggle.sh

# Quake-style Dropdown Scratchpad Terminal (Super+` or Super+U)
bind = $mainMod, grave, exec, /home/pooryasn/.config/hypr/scripts/scratchterm.sh
bind = $mainMod, U, exec, /home/pooryasn/.config/hypr/scripts/scratchterm.sh

# Fast Alt+Tab Window Cycling (Standard Windows/Linux behavior)
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bind = ALT SHIFT, Tab, cyclenext, prev
bind = ALT SHIFT, Tab, bringactivetotop,

# Visual Search Window Switcher (Super+Tab)
bind = $mainMod, Tab, exec, /home/pooryasn/.config/hypr/scripts/windowswitcher.py

# Lock Screen (Super+Shift+L or Super+Escape)
bind = $mainMod SHIFT, L, exec, hyprlock
bind = $mainMod, Escape, exec, hyprlock

# Task Manager / System Monitor
bind = CTRL SHIFT, Escape, exec, /home/pooryasn/.config/hypr/scripts/sysmonitor.sh

# Notification Controls (Dunst)
bind = $mainMod, N, exec, dunstctl close-all
bind = $mainMod CTRL, N, exec, dunstctl history-pop
bind = $mainMod CTRL, D, exec, dunstctl set-paused toggle && notify-send -a "Dunst" "Do Not Disturb" "Status toggled"

# Window Focus (Arrow keys & Vim keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Move Active Window to Other Monitor (Super + O, or Super + Shift + Arrows)
bind = $mainMod, O, movewindow, mon:+1
bind = $mainMod SHIFT, left, movewindow, mon:l
bind = $mainMod SHIFT, right, movewindow, mon:r
bind = $mainMod SHIFT, up, movewindow, mon:u
bind = $mainMod SHIFT, down, movewindow, mon:d

# Switch Focus between Monitors (Super + Alt + O, or Super + Alt + Arrows)
bind = $mainMod ALT, O, focusmonitor, +1
bind = $mainMod ALT, left, focusmonitor, l
bind = $mainMod ALT, right, focusmonitor, r

# Smooth Window Resizing with Keyboard (Super + Ctrl + Arrows or HJKL)
binde = $mainMod CTRL, right, resizeactive, 30 0
binde = $mainMod CTRL, left, resizeactive, -30 0
binde = $mainMod CTRL, up, resizeactive, 0 -30
binde = $mainMod CTRL, down, resizeactive, 0 30
binde = $mainMod CTRL, l, resizeactive, 30 0
binde = $mainMod CTRL, h, resizeactive, -30 0
binde = $mainMod CTRL, k, resizeactive, 0 -30
binde = $mainMod CTRL, j, resizeactive, 0 30

# Switch Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mouse Binds (drag move / resize)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume & Audio Controls (SwayOSD + PipeWire)
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl  = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl  = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle

# Screen Brightness Controls (SwayOSD + Brightnessctl)
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Media Player Controls (Playerctl)
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioPause, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
bindl  = , XF86AudioStop, exec, playerctl stop

# Extra Fn Hotkeys
bind   = , XF86Calculator, exec, gnome-calculator
bind   = , Caps_Lock, exec, swayosd-client --caps-lock

# Screenshot (Selection to clipboard & file)
bind = , Print, exec, /home/pooryasn/.config/hypr/scripts/screenshot.sh
bind = $mainMod, Print, exec, /home/pooryasn/.config/hypr/scripts/screenshot.sh full
bind = $mainMod SHIFT, S, exec, /home/pooryasn/.config/hypr/scripts/screenshot.sh

# Screen Video Recording (Super + Shift + R)
bind = $mainMod SHIFT, R, exec, /home/pooryasn/.config/hypr/scripts/screenrec.sh

# Toggle Background Apps / Magic Workspace (Karing)
bind = $mainMod, S, togglespecialworkspace, magic

### WINDOW RULES ###
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-floating-dialogs
    match:class = (pavucontrol|gnome-control-center|nm-connection-editor|org.gnome.FileRoller|gnome-calculator|wdisplays|nwg-displays)
    float = yes
    center = yes
}

windowrule {
    name = float-compact-apps
    match:class = ^(karing)$
    float = yes
    size = 440 700
    center = yes
}

windowrule {
    name = float-scratchterm
    match:title = ^(scratchterm)$
    float = yes
    size = 1100 650
    center = yes
}

windowrule {
    name = float-sysmonitor
    match:title = ^(System Resource Monitor)$
    float = yes
    size = 900 600
    center = yes
}

windowrule {
    name = float-calculator
    match:class = ^(org\.gnome\.Calculator|gnome-calculator)$
    float = yes
    size = 380 540
    center = yes
}

windowrule {
    name = float-scratchpad
    match:title = ^(Daily Scratchpad & Quick Todo)$
    float = yes
    size = 420 560
    center = yes
}

# Dedicated Smart Workspace Assignments (Page 1 Clean, 2 Chrome, 3 Proxies, 4 Telegram, 5 Antigravity)
windowrule {
    name = ws-chrome
    match:class = ^(google-chrome)$
    workspace = 2
}

windowrule {
    name = ws-proxies
    match:class = ^(karing|hiddify|app\.hiddify\.com|v2rayn|v2rayN)$
    workspace = 3
}

windowrule {
    name = ws-telegram
    match:class = ^(org\.telegram\.desktop|telegram-desktop|TelegramDesktop)$
    workspace = 4
}

windowrule {
    name = ws-antigravity
    match:class = ^(antigravity|Antigravity)$
    workspace = 5
}

windowrule {
    name = ws-spotify
    match:class = ^(spotify|Spotify)$
    workspace = 9
}

### LAYER RULES (Glassmorphism Blur) ###
layerrule {
    name = blur-wofi
    match:namespace = wofi
    blur = yes
}
